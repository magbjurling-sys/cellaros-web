<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fant ikke siden — CellarOS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/app-icon.svg">
<style>
@font-face{font-family:'Newsreader';font-style:normal;font-weight:400 600;font-display:swap;src:url("/fonts/newsreader-latin.woff2") format('woff2');}
@font-face{font-family:'Public Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url("/fonts/public-sans-latin.woff2") format('woff2');}
:root{
  --page:#101014;--card:#1e1e26;--border:#454552;
  --ink:#f1ede4;--muted:#b9b4a8;--accent:#c2a05a;--accent-ink:#241c08;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{--page:#f6f3ec;--card:#fffdf8;--border:#c8c0af;--ink:#26241e;--muted:#5d594e;
    --accent:#9a7c3e;--accent-ink:#fdf8ee;color-scheme:light}
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;background:var(--page);color:var(--ink);
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.6;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.box{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:44ch}
h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.15}
p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,20px);gap:6px;margin-bottom:6px}
.grid i{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;opacity:.5}
.grid i.gone{border-style:dashed;opacity:.3}
a{
  display:inline-flex;align-items:center;height:46px;padding:0 22px;margin-top:4px;
  background:var(--accent);color:var(--accent-ink);text-decoration:none;
  border-radius:9px;font-weight:600;font-size:.94rem;
}
a:hover{transform:translateY(-1px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <div class="grid" aria-hidden="true">
      <i></i><i></i><i></i>
      <i></i><i class="gone"></i><i></i>
      <i></i><i></i><i></i>
    </div>
    <h1>Den plassen står tom</h1>
    <p>Siden du lette etter finnes ikke — eller den har flyttet til en annen hylle.</p>
    <a href="/">Til forsiden</a>
  </div>
</body>
</html>
